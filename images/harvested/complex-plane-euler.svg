<svg role="img" aria-labelledby="t-cpe" viewBox="0 0 560 400" xmlns="http://www.w3.org/2000/svg">
  <title id="t-cpe">Complex plane and Euler's formula</title>
  <desc>The unit circle in the complex plane with the point e^{iθ} = cosθ + i sinθ marked in red, its angle θ, and projections onto the real and imaginary axes.</desc>
  <metadata><provenance>CANDIDATE · CAJAL PALETTE · QM VOL 5</provenance></metadata>
  <defs>
    <marker id="ar-cpe" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2a1a0e"/></marker>
    <marker id="arR-cpe" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#C8102E"/></marker>
  </defs>
  <rect x="0" y="0" width="560" height="400" fill="#FFFFFF"/>
  <text x="20" y="28" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="16" fill="#2a1a0e">The Complex Plane and Euler's Formula</text>
  <rect x="40" y="48" width="480" height="300" fill="#F5F5F5"/>
  <!-- axes -->
  <line x1="60" y1="198" x2="500" y2="198" stroke="#2a1a0e" stroke-width="1.2" marker-end="url(#ar-cpe)"/>
  <line x1="280" y1="338" x2="280" y2="58" stroke="#2a1a0e" stroke-width="1.2" marker-end="url(#ar-cpe)"/>
  <text x="505" y="202" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">Re</text>
  <text x="286" y="66" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">Im</text>
  <!-- unit circle r=120 -->
  <circle cx="280" cy="198" r="120" fill="none" stroke="#787878" stroke-width="1.2"/>
  <!-- angle 50deg -->
  <!-- point at theta=50deg: x=280+120cos50=357.1 y=198-120sin50=106.1 -->
  <line x1="280" y1="198" x2="357" y2="106" stroke="#C8102E" stroke-width="1.6"/>
  <line x1="357" y1="106" x2="357" y2="198" stroke="#545454" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="357" y1="106" x2="280" y2="106" stroke="#545454" stroke-width="1" stroke-dasharray="4 3"/>
  <!-- angle arc -->
  <path d="M 320 198 A 40 40 0 0 0 305.7 168.4" fill="none" stroke="#2a1a0e" stroke-width="1" marker-end="url(#ar-cpe)"/>
  <text x="318" y="178" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">θ</text>
  <!-- point -->
  <circle cx="357" cy="106" r="4.5" fill="#C8102E"/>
  <text x="365" y="100" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="12" fill="#C8102E">e^{iθ}</text>
  <!-- projections labels -->
  <text x="300" y="194" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">cosθ</text>
  <text x="362" y="156" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">sinθ</text>
  <text x="270" y="190" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">1</text>
  <text x="60" y="332" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#2a1a0e">e^{iθ} = cosθ + i sinθ,   |e^{iθ}| = 1</text>
  
</svg>
