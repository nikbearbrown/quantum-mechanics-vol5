<svg role="img" aria-labelledby="t-pex" viewBox="0 0 560 400" xmlns="http://www.w3.org/2000/svg">
  <title id="t-pex">Probability distribution: normalization and expectation</title>
  <desc>A probability density |ψ(x)|² shaded under the curve to show that its total area is one, with the expectation value ⟨x⟩ marked in red as a vertical line.</desc>
  <metadata><provenance>CANDIDATE · CAJAL PALETTE · QM VOL 5</provenance></metadata>
  <defs>
    <marker id="ar-pex" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2a1a0e"/></marker>
  </defs>
  <rect x="0" y="0" width="560" height="400" fill="#FFFFFF"/>
  <text x="20" y="28" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="16" fill="#2a1a0e">Normalization and Expectation</text>
  <rect x="40" y="48" width="480" height="300" fill="#F5F5F5"/>
  <line x1="60" y1="320" x2="500" y2="320" stroke="#2a1a0e" stroke-width="1.2" marker-end="url(#ar-pex)"/>
  <line x1="80" y1="338" x2="80" y2="62" stroke="#2a1a0e" stroke-width="1.2" marker-end="url(#ar-pex)"/>
  <text x="505" y="324" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">x</text>
  <text x="92" y="72" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">|ψ(x)|²</text>
  <!-- skewed gaussian-like density, peak near x=290, mean shifted right -->
  <path d="M80,320 L120,318 L160,310 L195,290 L225,250 L255,195 L285,140 L300,120 L315,140 L345,180 L375,225 L410,265 L445,295 L480,312 L500,318 L500,320 Z" fill="#ADADAD" fill-opacity="0.45" stroke="none"/>
  <path d="M80,320 L120,318 L160,310 L195,290 L225,250 L255,195 L285,140 L300,120 L315,140 L345,180 L375,225 L410,265 L445,295 L480,312 L500,318" fill="none" stroke="#2a1a0e" stroke-width="1.6"/>
  <!-- expectation line at x=318 (slightly right of peak due to right skew) -->
  <line x1="332" y1="320" x2="332" y2="118" stroke="#C8102E" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="338" y="132" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="12" fill="#C8102E">⟨x⟩</text>
  <text x="150" y="230" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">area = 1</text>
  <text x="60" y="368" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#2a1a0e">∫|ψ|²dx = 1     ⟨x⟩ = ∫ x|ψ(x)|² dx</text>
  
</svg>
