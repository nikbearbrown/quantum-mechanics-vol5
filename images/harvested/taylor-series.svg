<svg role="img" aria-labelledby="t-tay" viewBox="0 0 560 400" xmlns="http://www.w3.org/2000/svg">
  <title id="t-tay">Taylor series approximation of successive orders</title>
  <desc>The function sin(x) in red with its Taylor polynomials of order 1, 3, and 5 in grey, each hugging the curve over a wider interval as the order increases.</desc>
  <metadata><provenance>CANDIDATE · CAJAL PALETTE · QM VOL 5</provenance></metadata>
  <defs>
    <marker id="ar-tay" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2a1a0e"/></marker>
  </defs>
  <rect x="0" y="0" width="560" height="400" fill="#FFFFFF"/>
  <text x="20" y="28" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="16" fill="#2a1a0e">Taylor Series: Successive Orders</text>
  <rect x="40" y="48" width="480" height="300" fill="#F5F5F5"/>
  <line x1="60" y1="200" x2="500" y2="200" stroke="#2a1a0e" stroke-width="1.2" marker-end="url(#ar-tay)"/>
  <line x1="280" y1="338" x2="280" y2="62" stroke="#2a1a0e" stroke-width="1.2" marker-end="url(#ar-tay)"/>
  <text x="505" y="204" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">x</text>
  <text x="286" y="74" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">y</text>
  <!-- scale: x from -3.3..3.3 over 60..500 => 66.6 px/unit; center 280. y: sin amp 1 -> 70px -->
  <!-- sin(x) red exact -->
  <path d="M60,279 C90,255 110,232 130,213 C160,185 175,167 200,150 C225,135 250,127 280,127 C310,127 335,135 360,150 C385,167 400,185 430,213 C450,232 470,255 500,279" fill="none" stroke="#C8102E" stroke-width="2"/>
  <text x="463" y="312" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="12" fill="#C8102E">sin x</text>
  <!-- order 1: P1 = x line, slope -70/1 unit. through center; y=200-70x. at x=-3.3->200+231 ; clip in box -->
  <line x1="225" y1="338" x2="335" y2="62" stroke="#ADADAD" stroke-width="1.3"/>
  <text x="112" y="315" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="10" fill="#787878">P₁ = x</text>
  <!-- order 3: P3 = x - x^3/6 grey -->
  <path d="M150,338 C175,250 210,178 245,148 C262,134 280,128 280,128 C280,128 298,134 315,148 C350,178 385,250 410,338" fill="none" stroke="#787878" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="395" y="320" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="10" fill="#787878">P₃</text>
  <!-- order 5: P5 hugs more, grey solid darker -->
  <path d="M85,300 C115,262 140,232 170,205 C200,178 230,142 280,128 C330,142 360,178 390,205 C420,232 445,262 475,300" fill="none" stroke="#545454" stroke-width="1.4" stroke-dasharray="2 3"/>
  <text x="100" y="290" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="10" fill="#545454">P₅</text>
  <text x="60" y="368" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#2a1a0e">sin x = x − x³/3! + x⁵/5! − ⋯  =  Σ (−1)ⁿ x^{2n+1}/(2n+1)!</text>
  
</svg>
