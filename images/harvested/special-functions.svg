<svg role="img" aria-labelledby="t-spf" viewBox="0 0 560 400" xmlns="http://www.w3.org/2000/svg">
  <title id="t-spf">Special functions: Hermite, Legendre, Laguerre</title>
  <desc>Three families of orthogonal polynomials that arise in quantum mechanics—Hermite, Legendre, and Laguerre—plotted over their natural intervals, with the Hermite polynomial central to the harmonic oscillator shown in red.</desc>
  <metadata><provenance>CANDIDATE · CAJAL PALETTE · QM VOL 5</provenance></metadata>
  <defs>
    <marker id="ar-spf" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2a1a0e"/></marker>
  </defs>
  <rect x="0" y="0" width="560" height="400" fill="#FFFFFF"/>
  <text x="20" y="28" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="16" fill="#2a1a0e">Orthogonal Special Functions</text>
  <rect x="40" y="48" width="480" height="300" fill="#F5F5F5"/>
  <line x1="60" y1="200" x2="500" y2="200" stroke="#2a1a0e" stroke-width="1.2" marker-end="url(#ar-spf)"/>
  <line x1="280" y1="338" x2="280" y2="62" stroke="#2a1a0e" stroke-width="1.2" marker-end="url(#ar-spf)"/>
  <text x="505" y="204" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">x</text>
  <text x="286" y="74" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">P(x)</text>
  <!-- Legendre P3(x)= (5x^3-3x)/2 on [-1,1] grey. scale x -1..1 -> 180..380 (100px/unit), y amp 1 ->70px -->
  <path d="M180,270 C200,250 215,225 240,210 C255,202 265,200 280,200 C295,200 305,198 320,190 C345,175 360,150 380,130" fill="none" stroke="#787878" stroke-width="1.4"/>
  <text x="120" y="292" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="10" fill="#787878">Legendre P₃</text>
  <!-- Laguerre L2(x)=1-2x+x^2/2 on [0,large] grey dashed: starts high at x=0 dips below then rises. x 0..6 -> 280..520(40px/unit) y center 200 -->
  <path d="M280,130 C295,170 310,210 325,235 C338,254 352,256 366,242 C385,222 405,180 440,120" fill="none" stroke="#545454" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="380" y="256" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="10" fill="#545454">Laguerre L₂</text>
  <!-- Hermite H3(x)=8x^3-12x red on small interval; scale x -1.6..1.6 -> 200..360, normalized amplitude -->
  <path d="M200,300 C215,250 230,210 250,205 C262,202 270,225 280,250 C290,275 298,298 310,295 C330,290 345,250 360,100" fill="none" stroke="#C8102E" stroke-width="2"/>
  <text x="300" y="90" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="12" fill="#C8102E">Hermite H₃</text>
  <text x="60" y="368" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#2a1a0e">∫ wₐ(x) pₘ(x) pₙ(x) dx = 0  (m ≠ n)  — orthogonality with weight w</text>
  
</svg>
