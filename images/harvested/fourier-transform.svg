<svg role="img" aria-labelledby="t-ft" viewBox="0 0 560 400" xmlns="http://www.w3.org/2000/svg">
  <title id="t-ft">The Fourier transform pair: time and frequency</title>
  <desc>A Gaussian wave packet in the time domain on the left and its Fourier transform, also a Gaussian, in the frequency domain on the right; the narrow-broad reciprocity is the must-look element shown in red.</desc>
  <metadata><provenance>CANDIDATE · CAJAL PALETTE · QM VOL 5</provenance></metadata>
  <defs>
    <marker id="ar-ft" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2a1a0e"/></marker>
    <marker id="arR-ft" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#C8102E"/></marker>
  </defs>
  <rect x="0" y="0" width="560" height="400" fill="#FFFFFF"/>
  <text x="20" y="28" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="16" fill="#2a1a0e">The Fourier Transform Pair</text>
  <!-- left panel -->
  <rect x="40" y="60" width="210" height="240" fill="#F5F5F5"/>
  <line x1="55" y1="220" x2="240" y2="220" stroke="#2a1a0e" stroke-width="1.1" marker-end="url(#ar-ft)"/>
  <line x1="145" y1="290" x2="145" y2="72" stroke="#2a1a0e" stroke-width="1.1" marker-end="url(#ar-ft)"/>
  <text x="244" y="224" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">t</text>
  <!-- broad gaussian, narrow oscillation: a real wave packet (cos modulated gaussian) -->
  <path d="M55,219 C75,217 85,212 95,200 C103,210 110,218 118,205 C125,150 135,98 145,98 C155,98 165,150 172,205 C180,218 187,210 195,200 C205,212 215,217 235,219" fill="none" stroke="#545454" stroke-width="1.6"/>
  <text x="60" y="88" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">f(t)</text>
  <text x="80" y="284" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">time domain</text>
  <!-- right panel -->
  <rect x="350" y="60" width="170" height="240" fill="#F5F5F5"/>
  <line x1="365" y1="220" x2="510" y2="220" stroke="#2a1a0e" stroke-width="1.1" marker-end="url(#ar-ft)"/>
  <line x1="435" y1="290" x2="435" y2="72" stroke="#2a1a0e" stroke-width="1.1" marker-end="url(#ar-ft)"/>
  <text x="514" y="224" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">ω</text>
  <!-- transform: two narrow gaussian peaks at ±ω0 (carrier) -->
  <path d="M365,219 C385,219 392,219 400,190 C405,160 408,160 412,190 C418,219 422,219 435,219 C448,219 452,219 458,190 C462,160 465,160 470,190 C478,219 485,219 505,219" fill="none" stroke="#545454" stroke-width="1.6"/>
  <text x="372" y="88" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">F(ω)</text>
  <text x="378" y="284" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">frequency domain</text>
  <!-- transform arrow red -->
  <line x1="258" y1="160" x2="342" y2="160" stroke="#C8102E" stroke-width="1.8" marker-end="url(#arR-ft)"/>
  <text x="262" y="152" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="12" fill="#C8102E">ℱ</text>
  <text x="60" y="338" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#2a1a0e">F(ω) = ∫ f(t) e^{−iωt} dt      f(t) = (1/2π) ∫ F(ω) e^{iωt} dω</text>
  <text x="60" y="358" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">Narrow in t ⟷ broad in ω (the uncertainty reciprocity).</text>
  
</svg>
