<svg role="img" aria-labelledby="t-cov" viewBox="0 0 560 400" xmlns="http://www.w3.org/2000/svg">
  <title id="t-cov">Calculus of variations: the extremal path</title>
  <desc>Several candidate paths connecting two fixed endpoints; the extremal path that makes the action stationary is shown in red, while neighbouring varied paths are grey.</desc>
  <metadata><provenance>CANDIDATE · CAJAL PALETTE · QM VOL 5</provenance></metadata>
  <defs>
    <marker id="ar-cov" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2a1a0e"/></marker>
  </defs>
  <rect x="0" y="0" width="560" height="400" fill="#FFFFFF"/>
  <text x="20" y="28" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="16" fill="#2a1a0e">Calculus of Variations: The Extremal Path</text>
  <rect x="40" y="48" width="480" height="300" fill="#F5F5F5"/>
  <line x1="70" y1="320" x2="500" y2="320" stroke="#2a1a0e" stroke-width="1.2" marker-end="url(#ar-cov)"/>
  <line x1="90" y1="338" x2="90" y2="70" stroke="#2a1a0e" stroke-width="1.2" marker-end="url(#ar-cov)"/>
  <text x="505" y="324" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">x</text>
  <text x="70" y="80" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">y</text>
  <!-- endpoints A (110,250) and B (460,150) -->
  <!-- varied paths grey -->
  <path d="M110,250 C200,120 360,110 460,150" fill="none" stroke="#ADADAD" stroke-width="1.3"/>
  <path d="M110,250 C210,300 360,300 460,150" fill="none" stroke="#ADADAD" stroke-width="1.3"/>
  <path d="M110,250 C220,170 350,250 460,150" fill="none" stroke="#787878" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="180" y="120" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#787878">varied paths y+δy</text>
  <!-- extremal path red -->
  <path d="M110,250 C230,210 350,180 460,150" fill="none" stroke="#C8102E" stroke-width="2.4"/>
  <text x="300" y="220" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="12" fill="#C8102E">extremal: δS = 0</text>
  <!-- endpoints -->
  <circle cx="110" cy="250" r="4.5" fill="#2a1a0e"/>
  <text x="92" y="270" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#2a1a0e">A</text>
  <circle cx="460" cy="150" r="4.5" fill="#2a1a0e"/>
  <text x="466" y="146" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#2a1a0e">B</text>
  <text x="70" y="368" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#2a1a0e">S[y] = ∫ L(y,y',x)dx,  δS=0 ⇒ ∂L/∂y − d/dx(∂L/∂y') = 0</text>
  
</svg>
