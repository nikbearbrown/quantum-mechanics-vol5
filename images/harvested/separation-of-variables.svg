<svg role="img" aria-labelledby="t-sep" viewBox="0 0 560 400" xmlns="http://www.w3.org/2000/svg">
  <title id="t-sep">Separation of variables for a partial differential equation</title>
  <desc>A schematic showing a PDE in two variables split into a product of single-variable factors, each governed by an ordinary differential equation tied by a separation constant; the separation constant linking the two pieces is shown in red.</desc>
  <metadata><provenance>CANDIDATE · CAJAL PALETTE · QM VOL 5</provenance></metadata>
  <defs>
    <marker id="ar-sep" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2a1a0e"/></marker>
  </defs>
  <rect x="0" y="0" width="560" height="400" fill="#FFFFFF"/>
  <text x="20" y="28" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="16" fill="#2a1a0e">Separation of Variables</text>
  <rect x="40" y="48" width="480" height="300" fill="#F5F5F5"/>
  <!-- PDE box top -->
  <rect x="150" y="68" width="260" height="44" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1.2"/>
  <text x="280" y="88" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="12" fill="#2a1a0e">−(ℏ²/2m)∇²ψ + Vψ = Eψ</text>
  <text x="280" y="105" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">ψ(x,t) = X(x)·T(t)</text>
  <!-- branch arrows -->
  <line x1="240" y1="112" x2="160" y2="170" stroke="#2a1a0e" stroke-width="1.1" marker-end="url(#ar-sep)"/>
  <line x1="320" y1="112" x2="400" y2="170" stroke="#2a1a0e" stroke-width="1.1" marker-end="url(#ar-sep)"/>
  <!-- left ODE -->
  <rect x="70" y="176" width="180" height="60" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1.1"/>
  <text x="160" y="200" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="12" fill="#2a1a0e">X''/X = −k²</text>
  <text x="160" y="220" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">spatial ODE in x</text>
  <!-- right ODE -->
  <rect x="310" y="176" width="180" height="60" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1.1"/>
  <text x="400" y="200" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="12" fill="#2a1a0e">T'/T = −iE/ℏ</text>
  <text x="400" y="220" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">temporal ODE in t</text>
  <!-- separation constant linking, red -->
  <line x1="250" y1="262" x2="310" y2="262" stroke="#C8102E" stroke-width="1.6"/>
  <rect x="200" y="248" width="160" height="28" fill="#FFFFFF" stroke="#C8102E" stroke-width="1.4"/>
  <text x="280" y="267" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="12" fill="#C8102E">separation const λ</text>
  <line x1="160" y1="236" x2="240" y2="250" stroke="#C8102E" stroke-width="1.1" stroke-dasharray="4 3"/>
  <line x1="400" y1="236" x2="320" y2="250" stroke="#C8102E" stroke-width="1.1" stroke-dasharray="4 3"/>
  <text x="70" y="316" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#2a1a0e">Each side depends on one variable ⇒ both equal the same constant.</text>
  
</svg>
