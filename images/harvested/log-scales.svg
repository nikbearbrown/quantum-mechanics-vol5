<svg role="img" aria-labelledby="t-log" viewBox="0 0 560 400" xmlns="http://www.w3.org/2000/svg">
  <title id="t-log">Logarithmic scales and orders of magnitude</title>
  <desc>A logarithmic axis spanning many orders of magnitude where equal spacing means equal ratios; an exponential growth curve appears as a straight line on the log axis, with that linearized line shown in red.</desc>
  <metadata><provenance>CANDIDATE · CAJAL PALETTE · QM VOL 5</provenance></metadata>
  <defs>
    <marker id="ar-log" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2a1a0e"/></marker>
  </defs>
  <rect x="0" y="0" width="560" height="400" fill="#FFFFFF"/>
  <text x="20" y="28" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="16" fill="#2a1a0e">Logarithmic Scales: Orders of Magnitude</text>
  <rect x="40" y="48" width="480" height="300" fill="#F5F5F5"/>
  <line x1="80" y1="300" x2="500" y2="300" stroke="#2a1a0e" stroke-width="1.2" marker-end="url(#ar-log)"/>
  <line x1="80" y1="320" x2="80" y2="70" stroke="#2a1a0e" stroke-width="1.2" marker-end="url(#ar-log)"/>
  <text x="505" y="304" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">x</text>
  <text x="52" y="80" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">log y</text>
  <!-- decade gridlines: y = 10^0..10^6, equal spacing 35px from y=300 up -->
  <g font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="10" fill="#545454">
    <line x1="80" y1="300" x2="500" y2="300" stroke="#D4D4D4" stroke-width="0.8"/><text x="40" y="304">10⁰</text>
    <line x1="80" y1="262" x2="500" y2="262" stroke="#D4D4D4" stroke-width="0.8"/><text x="40" y="266">10¹</text>
    <line x1="80" y1="224" x2="500" y2="224" stroke="#D4D4D4" stroke-width="0.8"/><text x="40" y="228">10²</text>
    <line x1="80" y1="186" x2="500" y2="186" stroke="#D4D4D4" stroke-width="0.8"/><text x="40" y="190">10³</text>
    <line x1="80" y1="148" x2="500" y2="148" stroke="#D4D4D4" stroke-width="0.8"/><text x="40" y="152">10⁴</text>
    <line x1="80" y1="110" x2="500" y2="110" stroke="#D4D4D4" stroke-width="0.8"/><text x="40" y="114">10⁵</text>
  </g>
  <!-- exponential y=e^{kx} appears straight on log axis: red line from (90,290) to (480,100) -->
  <line x1="90" y1="290" x2="480" y2="105" stroke="#C8102E" stroke-width="2"/>
  <text x="120" y="150" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="12" fill="#C8102E">y = A·10^{kx}</text>
  <!-- markers on the red line -->
  <circle cx="90" cy="290" r="3.5" fill="#C8102E"/>
  <circle cx="285" cy="197" r="3.5" fill="#C8102E"/>
  <circle cx="480" cy="105" r="3.5" fill="#C8102E"/>
  <text x="70" y="338" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#2a1a0e">log(y) = log A + k x  — equal steps = equal ratios (×10 per decade)</text>
  
</svg>
